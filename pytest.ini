[pytest]
testpaths = tests
addopts = --html=reports/report.html --self-contained-html
markers =
    api: pure API tests
    ui: pure Selenium tests
    integration: API + UI cross-layer tests
    booking_by_id: needs /booking/{id}, which is currently 500 upstream
    room_by_id: needs /room/{id}, which is currently 500 upstream
