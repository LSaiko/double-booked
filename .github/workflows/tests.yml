name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # daily, the target is a public demo that resets

permissions:
  contents: read
  issues: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-report
          path: reports/report.html

  ui:
    runs-on: ubuntu-latest  # ships with Chrome; Selenium Manager fetches the matching driver
    needs: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "ui or integration" -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-report
          path: |
            reports/report.html
            screenshots/

  # its own job: when `api` fails, `ui` is skipped and never got to report it
  nightly-failure:
    runs-on: ubuntu-latest
    needs: [api, ui]
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label bug --state open                    --search "Nightly run failing in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Still failing: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label bug               --title "Nightly run failing"               --body "First seen: $run_url (report + screenshots in the artifacts)"
          fi
