name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # daily, the target is a public demo that resets

permissions:
  contents: read
  issues: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-report
          path: reports/report.html

  ui:
    runs-on: ubuntu-latest  # ships with Chrome; Selenium Manager fetches the matching driver
    needs: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "ui or integration" -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-report
          path: |
            reports/report.html
            screenshots/
      - name: Open issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label bug             --title "Nightly run failed $(date -u +%F)"             --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (report + screenshots in the artifacts)"
