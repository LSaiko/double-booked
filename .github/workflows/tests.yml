name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # daily, the target is a public demo that resets

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api -v

  ui:
    runs-on: ubuntu-latest  # ships with Chrome; Selenium Manager fetches the matching driver
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "ui or integration" -v
