name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # daily, the target is a public demo that resets

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m api -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/report.html

  ui:
    runs-on: ubuntu-latest  # ships with Chrome; Selenium Manager fetches the matching driver
    needs: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "ui or integration" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report
          path: |
            reports/report.html
            screenshots/
